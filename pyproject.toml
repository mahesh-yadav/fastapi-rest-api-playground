[project]
name = "rent-a-room"
version = "0.1.0"
description = "Rent-a-Room application for guests to book rooms"
readme = "README.md"
authors = [
    { name = "Mahesh Yadav", email = "mahesh.iitmandi@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-extra-types[phonenumbers]>=2.11.1",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "locust>=2.47.0",
    "ruff>=0.17.3",
]

[tool.fastapi]
entrypoint = "rent_a_room.main:app"

[tool.ruff]
src = [".", "src", "database_management"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
