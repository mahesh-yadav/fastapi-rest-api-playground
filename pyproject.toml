[project]
name = "rent-a-room"
version = "0.1.0"
description = "Rent-a-Room application for guests to book rooms"
readme = "README.md"
authors = [
    { name = "Mahesh Yadav", email = "mahesh.iitmandi@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.162.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.fastapi]
entrypoint = "src.rent_a_room.main:app"
